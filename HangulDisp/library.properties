sentence=16x16 조합형 한글을 픽셀 콜백으로 어떤 그래픽 디스플레이에든 출력합니다.
paragraph=EasyView 조합형 한글 폰트(초성 8벌/중성 4벌/종성 4벌)를 PROGMEM에 두고 초중종성을 합성해 16x16 한글을 그립니다. 픽셀 그리기 콜백 하나만 제공하면 U8glib, U8g2, GxEPD2, TFT_eSPI, Adafruit GFX 등 픽셀 출력이 가능한 그래픽 디스플레이에서 사용할 수 있습니다. 문자형(HD44780 계열) LCD는 지원 범위가 아닙니다. 영문/숫자/개행은 이 라이브러리가 아니라 기존 디스플레이 라이브러리의 폰트로 처리합니다.
